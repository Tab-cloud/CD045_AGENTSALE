packages:
  - apps/web/*
  - apps/web/packages/*
  - apps/agent/*
  - packages/*
overrides:
  urllib@4.9.0: 4.9.1
  ansi-regex@5.0.0: 5.0.1
nodeLinker: hoisted
packageImportMethod: copy
linkWorkspacePackages: false
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
allowBuilds:
  '@alicloud/openapi-core': false
  esbuild: true
  sharp: true
  unrs-resolver: true
patchedDependencies:
  mammoth@1.12.0: patches/mammoth@1.12.0.patch
